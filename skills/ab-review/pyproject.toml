[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrs-skill-ab-review"
version = "0.1.0"
description = "ab-review skill for multi-review-scheduler (A/B multi-round review)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Coca-Koala-Nut" }]
keywords = ["claude", "skill", "ab-review", "multi-review-scheduler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = []

[project.entry-points."multi_review_scheduler.skills"]
ab-review = "mrs_skill_ab_review:install"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mrs_skill_ab_review = [
    "SKILL.md",
    "README.md",
    "REFERENCE.md",
    "SUMMARY.md",
    "ab_review_onepage.html",
    "scripts/*.py",
]